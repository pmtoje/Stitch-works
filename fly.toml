# fly.toml app configuration file generated for stitch-works on 2026-11-23T12:20:42Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'stitch-works'
primary_region = 'ams'

[build]
[deploy]
  release_command = 'npx prisma migrate deploy'
  seed_command = 'tsx prisma/seed.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
